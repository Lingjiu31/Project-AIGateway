apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-gateway-ingress
  namespace: default
  annotations:
    # 声明使用 nginx 作为 Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    # 超时设置：AI 请求耗时长，默认 60s 不够用
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # 开启 SSE 流式响应支持，禁用缓冲
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  # TLS 配置：将 HTTPS 流量终止在 Ingress 层，Pod 内部只跑 HTTP
  tls:
    - hosts:
        - api.example.com  # 域名，目前没有
      secretName: ai-gateway-tls  # 存放 TLS 证书的 Secret，替换为真实证书
  rules:
    - host: api.example.com       # 替换为你的真实域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-gateway-service
                port:
                  number: 80
