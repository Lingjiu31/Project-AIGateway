apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-secret
  namespace: default
type: Opaque
# 使用说明：
#   1. 复制此文件为 secret.yaml
#   2. 替换下方所有占位符为真实值
#   3. secret.yaml 已在 .gitignore 中，不会被提交
#
# stringData 字段可直接填明文，k8s 会自动 base64 编码存储
# 如需手动编码：echo -n "your-value" | base64
stringData:
  DEEPSEEK_API_KEY: "your-deepseek-api-key"
  GLM_API_KEY: "your-glm-api-key"
  JWT_SECRET: "your-jwt-secret-change-in-production"  # 可用 openssl rand -hex 32 生成
  MYSQL_PASSWORD: "your-mysql-password"
