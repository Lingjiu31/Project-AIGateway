<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>AI Gateway · Test Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 13px;
      min-height: 100vh;
      padding: 32px;
    }

    h1 {
      color: #58a6ff;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
      border-bottom: 1px solid #21262d;
      padding-bottom: 12px;
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .panel {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 20px;
    }

    .panel h2 {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 16px;
    }

    .panel.chat { grid-column: 1 / -1; }

    label {
      display: block;
      color: #8b949e;
      font-size: 11px;
      margin-bottom: 4px;
      margin-top: 12px;
    }

    label:first-of-type { margin-top: 0; }

    input, textarea, select {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #c9d1d9;
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, textarea:focus, select:focus { border-color: #58a6ff; }

    select option { background: #161b22; }

    textarea { resize: vertical; min-height: 72px; }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
    }

    button {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #c9d1d9;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      padding: 7px 16px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    button:hover { background: #30363d; border-color: #8b949e; }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    button.primary:hover { background: #388bfd; border-color: #388bfd; }
    button.danger { background: #6e1919; border-color: #6e1919; color: #fff; }
    button.danger:hover { background: #9a2020; }

    .status {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 4px;
      margin-top: 10px;
      display: none;
    }
    .status.ok  { background: #0f2a1a; color: #3fb950; border: 1px solid #1a4c2a; display: block; }
    .status.err { background: #2a0f0f; color: #f85149; border: 1px solid #4c1a1a; display: block; }

    .token-bar {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 11px;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .token-bar span { color: #3fb950; word-break: break-all; flex: 1; }

    .models-bar {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .models-bar-title {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #8b949e;
      white-space: nowrap;
    }

    .model-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
    }

    .model-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .model-dot.healthy   { background: #3fb950; box-shadow: 0 0 4px #3fb95088; }
    .model-dot.open      { background: #f85149; box-shadow: 0 0 4px #f8514988; }
    .model-dot.half_open { background: #d29922; box-shadow: 0 0 4px #d2992288; }
    .model-dot.unknown   { background: #8b949e; }

    .model-status-name  { color: #c9d1d9; }
    .model-status-state { font-size: 10px; }
    .model-status-state.healthy   { color: #3fb950; }
    .model-status-state.open      { color: #f85149; }
    .model-status-state.half_open { color: #d29922; }
    .model-status-state.unknown   { color: #8b949e; }

    /* 对话区 */
    .conversation {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 4px;
      min-height: 200px;
      max-height: 420px;
      overflow-y: auto;
      padding: 12px;
      margin-top: 12px;
    }

    .msg {
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .msg-label {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .msg.user .msg-label  { color: #58a6ff; }
    .msg.ai   .msg-label  { color: #3fb950; }
    .msg.err  .msg-label  { color: #f85149; }

    .msg.user .msg-body { color: #c9d1d9; }
    .msg.ai   .msg-body { color: #e6edf3; white-space: pre-wrap; }
    .msg.err  .msg-body { color: #f85149; }

    .streaming { border-left: 2px solid #3fb950; padding-left: 8px; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      color: #8b949e;
      font-size: 12px;
    }
    input[type="checkbox"] { width: auto; accent-color: #58a6ff; }

    .model-tag {
      display: inline-block;
      background: #1c2d3a;
      border: 1px solid #1f6feb44;
      border-radius: 3px;
      color: #58a6ff;
      font-size: 10px;
      padding: 1px 6px;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<h1>AI Gateway · Test Console</h1>

<div class="token-bar">
  <span id="tokenDisplay">未登录 · 暂无 Token</span>
  <button onclick="clearToken()">清除</button>
</div>

<!-- 模型健康状态栏 -->
<div class="models-bar" id="modelsBar">
  <span class="models-bar-title">Models</span>
  <span style="color:#8b949e;font-size:11px;">连接中...</span>
</div>

<div class="panels">

  <!-- 注册 -->
  <div class="panel">
    <h2>Register</h2>
    <label>Username</label>
    <input id="regUser" type="text" placeholder="alice">
    <label>Password</label>
    <input id="regPass" type="password" placeholder="••••••">
    <div class="row">
      <button class="primary" onclick="register()">注册</button>
    </div>
    <div id="regStatus" class="status"></div>
  </div>

  <!-- 登录 -->
  <div class="panel">
    <h2>Login</h2>
    <label>Username</label>
    <input id="loginUser" type="text" placeholder="alice">
    <label>Password</label>
    <input id="loginPass" type="password" placeholder="••••••">
    <div class="row">
      <button class="primary" onclick="login()">登录</button>
    </div>
    <div id="loginStatus" class="status"></div>
  </div>

  <!-- 对话 -->
  <div class="panel chat">
    <h2>Chat · /v1/chat/completions</h2>

    <label>Model</label>
    <select id="modelSelect">
      <option value="deepseek-flash">deepseek-flash · V4 Flash（快速省钱）</option>
      <option value="deepseek-pro">deepseek-pro · V4 Pro（推理最强）</option>
      <option value="glm">glm · GLM-5（Agent 任务）</option>
      <option value="fake-broken">fake-broken · 测试熔断用</option>
    </select>

    <label>Message</label>
    <textarea id="chatMsg" placeholder="你好，请介绍一下自己" onkeydown="handleKey(event)"></textarea>

    <div class="checkbox-row">
      <input type="checkbox" id="streamToggle" checked>
      <label style="margin:0">Stream（SSE 流式）</label>
    </div>

    <div class="row">
      <button class="primary" onclick="chat()">发送 (Enter)</button>
      <button onclick="clearConversation()" class="danger">清空对话</button>
    </div>

    <div id="conversation" class="conversation">
      <div style="color:#8b949e;font-size:11px;">选择模型，输入消息，开始对话...</div>
    </div>
  </div>

</div>

<script>
  const BASE = 'http://localhost:8080'
  let token = ''
  let messages = []   // 多轮对话历史

  // 模型状态轮询
  const STATE_LABEL = { healthy: '正常', open: '熔断', half_open: '试探中', unknown: '未知' }

  async function fetchModels() {
    try {
      const res = await fetch(`${BASE}/models`)
      if (!res.ok) return
      const data = await res.json()
      const bar = document.getElementById('modelsBar')
      bar.innerHTML = '<span class="models-bar-title">Models</span>'
      for (const [name, state] of Object.entries(data)) {
        const item = document.createElement('div')
        item.className = 'model-status'
        item.innerHTML = `
          <div class="model-dot ${state}"></div>
          <span class="model-status-name">${name}</span>
          <span class="model-status-state ${state}">${STATE_LABEL[state] ?? state}</span>
        `
        bar.appendChild(item)
      }
    } catch {}
  }

  fetchModels()
  setInterval(fetchModels, 3000)

  // Enter 发送（Shift+Enter 换行）
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault()
      chat()
    }
  }

  function setStatus(id, msg, ok) {
    const el = document.getElementById(id)
    el.textContent = msg
    el.className = 'status ' + (ok ? 'ok' : 'err')
  }

  function setToken(t) {
    token = t
    document.getElementById('tokenDisplay').textContent =
      t ? '✓ ' + t.slice(0, 40) + '...' : '未登录 · 暂无 Token'
  }

  function clearToken() { setToken('') }

  function appendMsg(role, content, modelName) {
    const conv = document.getElementById('conversation')
    // 清除占位文字
    if (conv.querySelector('[data-placeholder]')) conv.innerHTML = ''

    const div = document.createElement('div')
    div.className = 'msg ' + role

    const label = document.createElement('div')
    label.className = 'msg-label'
    if (role === 'user') label.textContent = 'You'
    else if (role === 'ai') {
      label.innerHTML = 'AI' + (modelName ? `<span class="model-tag">${modelName}</span>` : '')
    } else {
      label.textContent = 'Error'
    }

    const body = document.createElement('div')
    body.className = 'msg-body'
    if (role === 'ai') body.classList.add('streaming')
    body.textContent = content

    div.appendChild(label)
    div.appendChild(body)
    conv.appendChild(div)
    conv.scrollTop = conv.scrollHeight
    return body  // 返回 body 元素，流式时可追加内容
  }

  function clearConversation() {
    messages = []
    document.getElementById('conversation').innerHTML =
      '<div style="color:#8b949e;font-size:11px;">对话已清空，开始新对话...</div>'
  }

  async function register() {
    const username = document.getElementById('regUser').value.trim()
    const password = document.getElementById('regPass').value
    if (!username || !password) return setStatus('regStatus', '请填写用户名和密码', false)
    try {
      const res = await fetch(`${BASE}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      const data = await res.json()
      res.ok
        ? setStatus('regStatus', `✓ 注册成功 · ${data.username}`, true)
        : setStatus('regStatus', `✗ ${data.error}`, false)
    } catch (e) {
      setStatus('regStatus', `✗ ${e.message}`, false)
    }
  }

  async function login() {
    const username = document.getElementById('loginUser').value.trim()
    const password = document.getElementById('loginPass').value
    if (!username || !password) return setStatus('loginStatus', '请填写用户名和密码', false)
    try {
      const res = await fetch(`${BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      const data = await res.json()
      if (res.ok) {
        setToken(data.token)
        setStatus('loginStatus', '✓ 登录成功，Token 已保存', true)
      } else {
        setStatus('loginStatus', `✗ ${data.error}`, false)
      }
    } catch (e) {
      setStatus('loginStatus', `✗ ${e.message}`, false)
    }
  }

  async function chat() {
    if (!token) {
      appendMsg('err', '请先登录获取 Token')
      return
    }
    const msg = document.getElementById('chatMsg').value.trim()
    if (!msg) return

    const modelName = document.getElementById('modelSelect').value
    const stream = document.getElementById('streamToggle').checked

    // 加入历史，显示用户消息
    messages.push({ role: 'user', content: msg })
    appendMsg('user', msg)
    document.getElementById('chatMsg').value = ''

    // AI 回复占位
    const aiBody = appendMsg('ai', '', modelName)

    try {
      const res = await fetch(`${BASE}/v1/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ model: modelName, messages, stream })
      })

      if (!res.ok) {
        const data = await res.json()
        aiBody.closest('.msg').className = 'msg err'
        aiBody.closest('.msg').querySelector('.msg-label').textContent = 'Error'
        aiBody.textContent = `${res.status} · ${data.error || '请求失败'}`
        // 失败的话把最后一条 user 消息从历史里移除，避免污染上下文
        messages.pop()
        return
      }

      if (!stream) {
        const data = await res.json()
        const content = data.choices?.[0]?.message?.content ?? JSON.stringify(data, null, 2)
        aiBody.textContent = content
        aiBody.classList.remove('streaming')
        messages.push({ role: 'assistant', content })
        return
      }

      // SSE 流式
      const reader = res.body.getReader()
      const decoder = new TextDecoder()
      let fullContent = ''

      while (true) {
        const { done, value } = await reader.read()
        if (done) break
        const chunk = decoder.decode(value)
        for (const line of chunk.split('\n')) {
          if (!line.startsWith('data: ')) continue
          const payload = line.slice(6).trim()
          if (payload === '[DONE]') break
          try {
            const json = JSON.parse(payload)
            const delta = json.choices?.[0]?.delta?.content
            if (delta) {
              fullContent += delta
              aiBody.textContent = fullContent
              aiBody.closest('.conversation').scrollTop = 99999
            }
          } catch {}
        }
      }

      aiBody.classList.remove('streaming')
      messages.push({ role: 'assistant', content: fullContent })

    } catch (e) {
      aiBody.closest('.msg').className = 'msg err'
      aiBody.textContent = `请求失败: ${e.message}`
      messages.pop()
    }
  }
</script>

</body>
</html>
